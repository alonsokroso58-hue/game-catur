<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catur Online Multiplayer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
</head>
<body>

  <div class="app-container">
    <div id="lobby" class="card">
      <h1>♟️ Catur Online</h1>
      <p>Masukkan Kode Kamar untuk main bareng:</p>
      <div class="input-group">
        <input type="text" id="roomInput" placeholder="Contoh: MAIN123">
        <button id="joinBtn">Masuk Kamar</button>
      </div>
    </div>

    <div id="gameArea" class="card hidden">
      <div class="header-info">
        <div id="roomDisplay">Kamar: -</div>
        <div id="status">Menunggu lawan...</div>
      </div>

      <div class="main-layout">
        <div class="board-section">
          <div class="timer-bar">Lawan: <span id="opponentTimer">05:00</span></div>
          <!-- Atribut style="width: 400px" sudah dihapus agar responsif di HP -->
          <div id="board"></div>
          <div class="timer-bar">Kamu: <span id="playerTimer">05:00</span></div>
        </div>

        <div class="side-panel">
          <h3>📜 Langkah</h3>
          <div id="moveLog" class="log-box"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Library External -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  
  <!-- Socket.io via CDN -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  
  <!-- File Logika Utama -->
  <script src="app.js"></script>
</body>
</html>
